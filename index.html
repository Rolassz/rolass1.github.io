<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolas</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #16161a;
    --text: #e6e6e9;
    --muted: #8a8a94;
    --accent: #7c8cff;
    --border: #23232a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    line-height: 1.6;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid var(--border);
    margin: 0 auto 1.2rem;
    overflow: hidden;
    background: #1a1a22;
    position: relative;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
    display: block;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2rem;
  }

  .badge.chrx {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.85rem;
    background: linear-gradient(135deg, #2a1d3a, #1d1d24);
    border: 1px solid #3d2a5a;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text);
  }

  .badge-icon {
    width: 26px;
    height: 26px;
    display: inline-block;
    vertical-align: middle;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .links a:hover {
    background: #1d1d24;
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  footer {
    margin-top: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="cat.jpg" alt="Rolas">
    </div>

    <h1>Rolas</h1>
    <p class="subtitle">rolass1 · sum slight sum slight 🙏</p>

    <div class="badges">
      <span class="badge chrx">💜 CHRX</span>

      <!-- Teal diamond -->
      <svg class="badge-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7ee9d4"/>
            <stop offset="100%" stop-color="#2bb39a"/>
          </linearGradient>
        </defs>
        <path d="M16 2 L28 14 L16 30 L4 14 Z" fill="url(#g1)" stroke="#a8f5e4" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M16 8 L23 14 L16 22 L9 14 Z" fill="#0d3a33" opacity="0.6"/>
      </svg>

      <!-- Purple flower -->
      <svg class="badge-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c6a8ff"/>
            <stop offset="100%" stop-color="#7d4fd6"/>
          </linearGradient>
        </defs>
        <g fill="url(#g2)" stroke="#e0cfff" stroke-width="0.8" stroke-linejoin="round">
          <path d="M16 6 C18 10 18 12 16 16 C14 12 14 10 16 6Z"/>
          <path d="M16 26 C18 22 18 20 16 16 C14 20 14 22 16 26Z"/>
          <path d="M6 16 C10 18 12 18 16 16 C12 14 10 14 6 16Z"/>
          <path d="M26 16 C22 18 20 18 16 16 C20 14 22 14 26 16Z"/>
        </g>
        <circle cx="16" cy="16" r="2.2" fill="#3a1d6e"/>
      </svg>

      <!-- Green leaf -->
      <svg class="badge-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8ee89a"/>
            <stop offset="100%" stop-color="#3ba84a"/>
          </linearGradient>
        </defs>
        <path d="M6 24 C6 14 14 6 26 6 C26 18 18 26 8 26 Z" fill="url(#g3)" stroke="#b8f5c0" stroke-width="1"/>
        <path d="M9 23 C14 18 20 12 24 9" stroke="#0d3a15" stroke-width="1.2" fill="none" opacity="0.5"/>
      </svg>

      <!-- Pink/purple sparkle -->
      <svg class="badge-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff9ee0"/>
            <stop offset="100%" stop-color="#7c5cff"/>
          </linearGradient>
        </defs>
        <path d="M16 3 L19 13 L29 16 L19 19 L16 29 L13 19 L3 16 L13 13 Z" fill="url(#g4)" stroke="#ffd8f5" stroke-width="1" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.9"/>
      </svg>
    </div>

    <div class="links">
      <a href="https://github.com/rolass1" target="_blank" rel="noopener">GitHub</a>
      <a onclick="navigator.clipboard.writeText('rolass1'); this.textContent='Copied!'; setTimeout(()=>this.textContent='Discord: rolass1', 1200); return false;">Discord: rolass1</a>
    </div>

    <footer>© 2025 Rolas</footer>
  </div>
</body>
</html>
